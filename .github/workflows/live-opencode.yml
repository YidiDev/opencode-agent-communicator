name: OpenCode 2 compatibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  opencode-2:
    name: OpenCode ${{ matrix.version }} live compatibility
    strategy:
      fail-fast: false
      matrix:
        version: ["2.1.3", "2.2.2"]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENCODE_COMPAT_VERSION: ${{ matrix.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Snapshot packed build runtime dependencies
        env:
          OPENCODE_COMMUNICATOR_PACKED_RUNTIME_DEPENDENCIES_ROOT: ${{ runner.temp }}/opencode-communicator-packed-runtime
        run: node tools/snapshot-runtime-dependencies.mjs
      - name: Install isolated newer host without changing build dependencies
        if: matrix.version != '2.1.3'
        run: |
          host_root="$RUNNER_TEMP/opencode-compat-host"
          npm install --prefix "$host_root" --ignore-scripts --no-fund --no-audit --save-exact "@opencode/cli@$OPENCODE_COMPAT_VERSION"
          node "$host_root/node_modules/@opencode/cli/postinstall.mjs"
          echo "OPENCODE_COMPAT_CLI_ROOT=$host_root" >> "$GITHUB_ENV"
      - name: Verify live-gate prerequisites
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(bun --version)" = 1.4.0
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const build = packageJson.devDependencies?.["@opencode/cli"];
          if (build !== "2.1.3" || packageJson.dependencies?.["@opencode/plugin"] !== build) {
            throw new Error("OpenCode CLI and plugin packages must equal 2.1.3");
          }
          const range = ">=2.1.3 <2.3.0";
          if (
            packageJson.peerDependencies?.["@opencode/cli"] !== range ||
            packageJson.engines?.opencode !== range
          ) {
            throw new Error(`OpenCode compatibility metadata must equal ${range}`);
          }
          NODE
          host_root="${OPENCODE_COMPAT_CLI_ROOT:-$PWD}"
          test "$("$host_root/node_modules/.bin/opencode" --version)" = "opencode v$OPENCODE_COMPAT_VERSION"
      - name: Run isolated compatibility harness
        env:
          OPENCODE_COMMUNICATOR_PACKED_RUNTIME_DEPENDENCIES_ROOT: ${{ runner.temp }}/opencode-communicator-packed-runtime
        run: bun run test:live
