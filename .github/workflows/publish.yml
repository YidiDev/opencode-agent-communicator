name: Publish npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Tag and package version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Require the tagged commit to be reachable from trusted main
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          fetch_depth=()
          test ! -f "$(git rev-parse --git-path shallow)" || fetch_depth=(--unshallow)
          git fetch --no-tags --prune "${fetch_depth[@]}" origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
      - name: Require an exact v<package-version> tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version" || {
            printf 'tag %s does not match package version %s\n' "$RELEASE_TAG" "$package_version" >&2
            exit 1
          }

  verification:
    name: All Linux x64 release checks
    needs: metadata
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  live:
    name: Exact 1.18.21 release gate
    needs: metadata
    uses: ./.github/workflows/live-opencode.yml
    permissions:
      contents: read

  archive:
    name: Build the release archive once
    needs:
      - metadata
      - verification
      - live
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.release_evidence.outputs.archive_sha256 }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node for npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Recheck tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = x86_64
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Verify and build one tokenless archive
        id: release_evidence
        run: |
          test -z "${NODE_AUTH_TOKEN:-}"
          bun run verify:package
          mkdir release
          npm pack --json --pack-destination release > release/pack-report.json
          archive_count="$(find release -maxdepth 1 -type f -name '*.tgz' | wc -l)"
          test "$archive_count" = 1
          archive="$(find release -maxdepth 1 -type f -name '*.tgz')"
          (cd release && sha256sum "$(basename "$archive")" > SHA256SUMS)
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'archive_sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"
          rm release/pack-report.json
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish the verified archive
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ github.sha }}
          path: release
      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24.6.0 ships with npm 11.5.1; do not install packages in this OIDC job.
          node-version: 24.6.0
      - name: Verify digest and publish that exact archive
        working-directory: release
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.archive.outputs.archive_sha256 }}
        run: |
          test -z "${NODE_AUTH_TOKEN:-}"
          test "$(node --version)" = "v24.6.0"
          test "$(npm --version)" = "11.5.1"
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          sha256sum --check SHA256SUMS
          archive_count="$(find . -maxdepth 1 -type f -name '*.tgz' | wc -l)"
          test "$archive_count" = 1
          archive="$(find . -maxdepth 1 -type f -name '*.tgz')"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$EXPECTED_ARCHIVE_SHA256"
          npm publish "$archive" --access public --provenance
